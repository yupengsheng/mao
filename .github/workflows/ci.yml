name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy:
        description: "校验通过后部署到生产服务器（仅从 main 运行）"
        required: true
        default: false
        type: boolean
permissions:
  contents: read

jobs:
  backend:
    name: Backend TS Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend-ts/package-lock.json

      - name: Install dependencies
        working-directory: backend-ts
        run: npm ci

      - name: Build backend-ts
        working-directory: backend-ts
        run: npm run build

      - name: Test backend-ts
        working-directory: backend-ts
        run: npm test

  admin:
    name: Admin Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Build admin
        working-directory: admin
        run: npm run build

  desktop:
    name: Desktop Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3 python3-setuptools make g++

      - name: Install dependencies
        working-directory: desktop
        # CI 只跑 vitest / vue-tsc / vite，不启动 Electron。跳过 lifecycle
        # 以免 electron 二进制下载和 node-pty 的 electron-rebuild 拖垮或弄挂 npm ci。
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Run unit tests
        working-directory: desktop
        run: npm run test:unit

      - name: Build desktop
        working-directory: desktop
        run: npm run build

  embed-sdk:
    name: Embed SDK Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/embed/package-lock.json

      - name: Install dependencies
        working-directory: sdk/embed
        run: npm ci

      - name: Build embed SDK
        working-directory: sdk/embed
        run: npm run build

      - name: Test embed SDK
        working-directory: sdk/embed
        run: npm test

      - name: Check bundle size
        working-directory: sdk/embed
        run: npm run size

      - name: Test artifact verifier
        working-directory: desktop
        run: npm run test:embed-sdk

      - name: Verify committed SDK artifacts match rebuilt bundle
        run: node desktop/scripts/verify-embed-sdk.cjs --strict

  agent-cli:
    name: Agent CLI Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: agent-cli/package-lock.json

      - name: Install dependencies
        working-directory: agent-cli
        run: npm ci

      - name: Build agent-cli
        working-directory: agent-cli
        run: npm run build

      - name: Typecheck agent-cli tests
        working-directory: agent-cli
        run: npm run typecheck

      - name: Test agent-cli
        working-directory: agent-cli
        run: npm test

      - name: Vendor localShell stays in sync
        run: cmp desktop/electron/localShell.cjs agent-cli/vendor/localShell.cjs

      - name: Pack agent-cli
        working-directory: agent-cli
        run: npm pack --dry-run

  deploy:
    name: Deploy to 43.142.86.132
    # main 推送自动部署；手动触发时只有明确勾选 deploy 才部署。
    if: >-
      github.ref == 'refs/heads/main'
      && (
        github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    runs-on: ubuntu-latest
    needs:
      - backend
      - admin
      - desktop
      - embed-sdk
      - agent-cli
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 SSH 私钥
        env:
          MAO_DEPLOY_SSH_KEY: ${{ secrets.MAO_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${MAO_DEPLOY_SSH_KEY:?需配置仓库 secret MAO_DEPLOY_SSH_KEY（43.142.86.132 的 SSH 私钥）}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$MAO_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          # 只信任目标主机，避免把密钥用到其它地址
          ssh-keyscan -t ed25519,rsa 43.142.86.132 >> "$HOME/.ssh/known_hosts" 2>/dev/null \
            || ssh-keyscan 43.142.86.132 >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: 验证服务器连通性
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ubuntu@43.142.86.132 'echo "SSH 连通正常：$(hostname)"'

      - name: 确保线上检出与部署脚本就位
        # 已有检出时先上传本次提交中的部署脚本，避免线上旧脚本无法处理新参数；
        # 首次部署时再用 Actions token 克隆仓库。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAO_DEPLOY_GIT_URL: ${{ secrets.MAO_DEPLOY_GIT_URL }}
        run: |
          set -euo pipefail
          if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
             ubuntu@43.142.86.132 'test -d /opt/mao/.git'; then
            echo "线上已有 /opt/mao git 检出，上传本次部署脚本"
            scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes \
              scripts/remote-deploy.sh \
              ubuntu@43.142.86.132:/tmp/mao-remote-deploy.sh
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              ubuntu@43.142.86.132 \
              'install -m 755 /tmp/mao-remote-deploy.sh /opt/mao/scripts/remote-deploy.sh && rm -f /tmp/mao-remote-deploy.sh'
            exit 0
          fi

          if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
             ubuntu@43.142.86.132 'test -e /opt/mao'; then
            echo "错误：线上 /opt/mao 已存在但不是 git 检出，拒绝覆盖。请先人工处理。" >&2
            exit 1
          fi

          echo "线上尚无检出，首次克隆 ${GITHUB_REPOSITORY} ..."
          # 私有仓库可配置 MAO_DEPLOY_GIT_URL（应包含服务器可用的凭据）；未配置时使用本次
          # Actions token 克隆，随后将该地址持久化为 origin，供后续 git pull 使用。
          clone_url="${MAO_DEPLOY_GIT_URL:-https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git}"
          encoded_clone_url="$(printf '%s' "$clone_url" | base64 -w0)"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ubuntu@43.142.86.132 \
            "encoded_clone_url='${encoded_clone_url}'; clone_url=\$(printf '%s' \"\$encoded_clone_url\" | base64 -d); git clone \"\$clone_url\" /opt/mao && cd /opt/mao && git checkout main"
          # 克隆用的临时 URL 带 token，不能留在线上 git config 里。
          # 后续 git pull 用的地址由仓库 secret MAO_DEPLOY_GIT_URL 提供；
          # 未配置时回落 GitHub 官方地址（公开仓库可直接使用）。
          clean_url="${MAO_DEPLOY_GIT_URL:-https://github.com/${GITHUB_REPOSITORY}.git}"
          encoded_clean_url="$(printf '%s' "$clean_url" | base64 -w0)"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ubuntu@43.142.86.132 \
            "encoded_clean_url='${encoded_clean_url}'; clean_url=\$(printf '%s' \"\$encoded_clean_url\" | base64 -d); cd /opt/mao && git remote set-url origin \"\$clean_url\""

      - name: 部署到服务器
        run: |
          set -euo pipefail
          # --expect-commit：线上拉到的 HEAD 必须就是本次 CI 校验过的提交，
          # 避免推送后又有新提交、把未经验证的代码带到线上。
          # 远程命令用双引号包裹以便展开 CI 侧的 $GITHUB_SHA（单引号会把 $0 留在远端展开，
          # 拿到的是远端 shell 自身而不是提交号）。
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ubuntu@43.142.86.132 \
            "bash /opt/mao/scripts/remote-deploy.sh --ref main --expect-commit '${GITHUB_SHA}'"

      - name: 部署后健康检查
        run: |
          set -euo pipefail
          # 蓝绿端口会切换，两个都探一遍；后端启动要数秒，最多等 60 秒
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ubuntu@43.142.86.132 '
              set -e
              for port in 9080 9081; do
                code=$(curl -fsS -o /dev/null -w "%{http_code}" \
                  "http://127.0.0.1:${port}/api/v1/health" 2>/dev/null || true)
                if [ "$code" = "200" ]; then
                  echo "后端健康检查通过：端口 ${port} /api/v1/health -> 200"
                  exit 0
                fi
              done
              for _ in $(seq 1 30); do
                for port in 9080 9081; do
                  code=$(curl -fsS -o /dev/null -w "%{http_code}" \
                    "http://127.0.0.1:${port}/api/v1/health" 2>/dev/null || true)
                  if [ "$code" = "200" ]; then
                    echo "后端健康检查通过：端口 ${port} /api/v1/health -> 200"
                    exit 0
                  fi
                done
                sleep 2
              done
              echo "后端健康检查失败：9080 / 9081 的 /api/v1/health 均未返回 200" >&2
              exit 1
            '
